name = "gms-hub-votes"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Short shop links with link previews: gms-hub.com/s/<name> (src/shop-preview.js). The rest of the site stays on Pages.
routes = [{ pattern = "gms-hub.com/s/*", zone_name = "gms-hub.com" }, { pattern = "gms-hub.com/og/*", zone_name = "gms-hub.com" }]
# The API itself stays on workers.dev (pages call gms-hub-votes.kwonth211.workers.dev).
workers_dev = true

[vars]
# Cloudflare account that holds the gms-hub.com Web Analytics site (read by src/traffic.js with the CF_ANALYTICS_TOKEN secret).
CF_ACCOUNT_ID = "2d797e9348660f2d5a228739b19cd956"
# Daily market summary goes to #시세-거래-market in the GMS Hub Discord (src/discord.js marketToDiscord, bot token).
DISCORD_MARKET_CHANNEL = "1570460864614633533"
# Game notices (Korean summary cards, maintenance reminders) go to #공지-announcements; 무료 고확 to #한국어-거래.
DISCORD_NOTICE_CHANNEL = "1570460197812572280"
DISCORD_TRADE_CHANNEL = "1571870717958430834"
# Small hourly batches; existing daily usage is retained across a policy change. D1 free allows 100,000 rows written a
# day and every index entry counts, so a listing costs about four: 9,000 listings a day leaves room for megaphones.
MARKET_BATCH_PAUSED = "false"
MARKET_BATCH_DAILY_ROWS = "40000"
MARKET_BATCH_MIN_INTERVAL_SECONDS = "600"
MARKET_BATCH_MAX_ROWS = "150"
MARKET_BATCH_MAX_ITEMS = "60"
MARKET_BATCH_SHOPS_PER_ITEM = "5"
MARKET_BATCH_MAX_SHOPS = "150"
# Boost mode scope (switched on/off with scripts/collector-boost.sh; state in D1 snapshots "market-boost").
MARKET_BATCH_BOOST_MAX_SHOPS = "200"
MARKET_BATCH_BOOST_MAX_ROWS = "200"
# Web Push (price alerts): public half of the VAPID key; the private half is the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC = "BJqUwAMBL2kL0VOHin8sIsDgRP-g7I34ddinSHW3JJlCKoU8tSXPSjTZbQo4I71kSWSvbSg8XAg8w_e29WOWaog"
VAPID_SUBJECT = "mailto:contact@gms-hub.com"
# Discord bot slash commands (src/discord-bot.js): the application's public key that verifies Discord's signature
# (public, shown on the Developer Portal), and the invite the bot hands out.
DISCORD_PUBLIC_KEY = "d680698602135c2a47f7054d1ec72b69ab810f0b8965de527a74375a32a801b2"
DISCORD_INVITE = "https://discord.gg/nUKhUjKvRX"
# /feedback posts into this channel of the GMS Hub server (needs the DISCORD_BOT_TOKEN secret, as do /alert DMs).
DISCORD_FEEDBACK_CHANNEL = "1570460324203602010"
# Website price alerts log in with Discord (src/discord-oauth.js): the application (client) id and the server people join.
# The client secret is the DISCORD_CLIENT_SECRET secret; the redirect URI <worker>/discord/oauth is set on the Developer Portal.
DISCORD_APP_ID = "1570465541343150292"
DISCORD_GUILD_ID = "1570460084230955018"
# #공지: the official Discord's Classic World announcements are followed into it; /news reads them from here.
DISCORD_NEWS_CHANNEL = "1570460197812572280"

# Email Service: send as contact@gms-hub.com (src/inbox.js handleSendMail).
# Workers AI: Korean summaries for new official notices (news.js), a few calls a week.
[ai]
binding = "AI"

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "gms-hub-votes"
database_id = "5e551116-5641-480e-99f3-70fd856cc675"

# Market ranking is recomputed every 15 minutes on this schedule and stored, so page views never recompute it.
[triggers]
crons = ["*/15 * * * *"]

# Live viewer count (src/presence.js). SQLite-backed class so it runs on the free plan; it never writes storage.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "presence-v1"
new_sqlite_classes = ["Presence"]

# Per-IP rate limits (src/index.js): public writes (votes, price reports, shop uploads, free megaphones, the dashboard
# login) and reads. A flood from one address is answered 429 before any database work.
[[unsafe.bindings]]
name = "RL_WRITE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[[unsafe.bindings]]
name = "RL_READ"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 400, period = 60 }
