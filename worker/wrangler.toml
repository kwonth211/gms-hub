name = "gms-hub-votes"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Small hourly batches; existing daily usage is retained across a policy change. D1 free allows 100,000 rows written a
# day and every index entry counts, so a listing costs about four: 9,000 listings a day leaves room for megaphones.
MARKET_BATCH_PAUSED = "false"
MARKET_BATCH_DAILY_ROWS = "20000"
MARKET_BATCH_MIN_INTERVAL_SECONDS = "600"
MARKET_BATCH_MAX_ROWS = "150"
MARKET_BATCH_MAX_ITEMS = "30"
MARKET_BATCH_SHOPS_PER_ITEM = "10"
MARKET_BATCH_MAX_SHOPS = "150"
# Web Push (price alerts): public half of the VAPID key; the private half is the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC = "BJqUwAMBL2kL0VOHin8sIsDgRP-g7I34ddinSHW3JJlCKoU8tSXPSjTZbQo4I71kSWSvbSg8XAg8w_e29WOWaog"
VAPID_SUBJECT = "mailto:contact@gms-hub.com"
# Discord bot slash commands (src/discord-bot.js): the application's public key that verifies Discord's signature
# (public, shown on the Developer Portal), and the invite the bot hands out.
DISCORD_PUBLIC_KEY = "d680698602135c2a47f7054d1ec72b69ab810f0b8965de527a74375a32a801b2"
DISCORD_INVITE = "https://discord.gg/kVmXpHSKq"
# /feedback posts into this channel of the GMS Hub server (needs the DISCORD_BOT_TOKEN secret, as do /alert DMs).
DISCORD_FEEDBACK_CHANNEL = "1570460324203602010"

[[d1_databases]]
binding = "DB"
database_name = "gms-hub-votes"
database_id = "5e551116-5641-480e-99f3-70fd856cc675"

# Market ranking is recomputed every 15 minutes on this schedule and stored, so page views never recompute it.
[triggers]
crons = ["*/15 * * * *"]

# Live viewer count (src/presence.js). SQLite-backed class so it runs on the free plan; it never writes storage.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "presence-v1"
new_sqlite_classes = ["Presence"]
