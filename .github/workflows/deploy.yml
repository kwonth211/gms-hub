name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the item pages carry the latest scanned prices (00:10 KST).
  schedule:
    - cron: '10 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify API permissions, cache and private settings
        run: node --test tests/security.test.mjs tests/public-cache.test.mjs tests/worker.test.mjs tests/usage-guard.test.mjs tests/inbox.test.mjs tests/shop-scan.test.mjs tests/market-batch.test.mjs tests/item-options.test.mjs tests/item-tip.test.mjs tests/mega-options.test.mjs tests/mega-reader.test.mjs tests/option-filter.test.mjs tests/market-share.test.mjs tests/market-browser.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: scripts/market-batch
      - run: npm test
        working-directory: scripts/market-batch

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-item-prices.mjs
      - run: node scripts/fetch-market-report.mjs
      - run: node scripts/fetch-weekly-report.mjs
      - run: node scripts/fetch-official-news.mjs
      - run: node scripts/fetch-page-snapshots.mjs
      - name: Build and verify content publication rules
        run: node --test tests/content.test.mjs tests/monsters.test.mjs tests/collection-status.test.mjs tests/product-analytics.test.mjs tests/hero-storm.test.mjs
      # Pages whose content differs from the live site, for IndexNow (Naver, Bing) once this deploy is live.
      - name: List changed pages
        run: |
          curl -sf https://gms-hub.com/page-hashes.json -o live-hashes.json || echo '{}' > live-hashes.json
          node scripts/changed-pages.mjs live-hashes.json > changed-urls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: changed-urls
          path: changed-urls.txt
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: changed-urls
      # GitHub Pages can take a minute to serve the new build; IndexNow is best effort and never fails the deploy.
      - run: sleep 60 && node scripts/indexnow.mjs changed-urls.txt
        continue-on-error: true
